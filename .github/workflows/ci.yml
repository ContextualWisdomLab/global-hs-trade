name: Global HS Trade CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-hs-trade-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.txt
      - name: Run regression tests with warnings as errors
        run: python scripts/check.py
      - name: Compile source
        run: python -W error -m compileall -q global_hs_trade scripts
      - name: Verify isolated wheel installation and synthetic query
        run: python scripts/verify_install.py
